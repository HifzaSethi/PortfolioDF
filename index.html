<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#010102" />
    <script>
      (function () {
        var nextTheme = 'night';
        try {
          var saved = localStorage.getItem('df-theme');
          if (saved === 'day') nextTheme = 'day';
        } catch (e) {
          nextTheme = 'night';
        }
        document.documentElement.setAttribute('data-theme', nextTheme);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', nextTheme === 'day' ? '#F4F1EA' : '#010102');
        }
        try {
          var h = window.location.hash;
          var isRoot = !h || h === '#' || h === '#/';
          if (isRoot && sessionStorage.getItem('df-intro-seen') !== '1') {
            document.documentElement.dataset.intro = 'pending';
            window.setTimeout(function () {
              if (document.documentElement.dataset.intro === 'pending') {
                delete document.documentElement.dataset.intro;
              }
            }, 8000);
          }
        } catch (e) {
          /* ignore storage errors */
        }
      })();
    </script>
    <noscript>
      <style>
        html[data-intro='pending'] body::before {
          display: none !important;
        }
      </style>
    </noscript>
    <title>Digital Field. (DF.) — Performance in Context</title>
    <meta
      name="description"
      content="Digital Field. (DF.) is a Digital Performance & Intelligence Consultancy connecting brand, search, media, technology, content, and data into commercial growth."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Field." />
    <meta property="og:title" content="Digital Field. (DF.) — Performance in Context" />
    <meta
      property="og:description"
      content="Nothing performs in isolation. DF. connects the signals others report separately into one commercial intelligence system."
    />
    <meta property="og:image" content="/og-placeholder.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Field. (DF.) — Performance in Context" />
    <meta
      name="twitter:description"
      content="Nothing performs in isolation. DF. connects the signals others report separately into one commercial intelligence system."
    />
    <meta name="twitter:image" content="/og-placeholder.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
